<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="BestAIBuys — find your goods at the best price. AI shopping assistant that surfaces three smart picks across budget, value, and premium tiers." />
    <meta name="theme-color" content="#F1EEDA" />

    <!-- Social share preview (Open Graph + Twitter Card). Static & generic —
         every link (incl. shared /s/:id) renders the same branded card, since
         the SPA can't inject per-share tags without SSR. Absolute URLs are
         required by crawlers; keep the host in sync with the prod domain. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="BestAIBuys" />
    <meta property="og:title" content="BestAIBuys — find your goods at the best price" />
    <meta property="og:description" content="AI shopping assistant that surfaces smart picks across budget, value, and premium tiers — no ads, no affiliate bias." />
    <meta property="og:image" content="https://app.bestaibuys.com/bm-shoppers.jpg" />
    <meta property="og:url" content="https://app.bestaibuys.com/" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="BestAIBuys — find your goods at the best price" />
    <meta name="twitter:description" content="AI shopping assistant that surfaces smart picks across budget, value, and premium tiers — no ads, no affiliate bias." />
    <meta name="twitter:image" content="https://app.bestaibuys.com/bm-shoppers.jpg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>BestAIBuys — find your goods at the best price</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
